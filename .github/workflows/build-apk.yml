name: Test and Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      abi_only:
        description: "Limit to ABI(s) for a smaller APK, e.g. arm64-v8a (empty = all)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ARGS=""
          if [ -n "${{ inputs.abi_only }}" ]; then ARGS="-PabiOnly=${{ inputs.abi_only }}"; fi
          chmod +x ./gradlew
          ./gradlew assembleDebug $ARGS --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: grimreader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
