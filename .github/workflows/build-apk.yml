name: Test and Build Grimreader

# main         -> test, version from conventional commits, signed APK + AAB attached to a GitHub release (Play versionCode X*1000)
# development  -> test, signed AAB for the Play Console closed test (Play versionCode lastRelease*1000 + 1..999)
# any other    -> test, debug APK as artifact; package id gets ".test" so it can never collide with the Play app
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      abi_only:
        description: "Limit to ABI(s) for a smaller test APK, e.g. arm64-v8a (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

# One run per ref. Main never cancels so two releases can't race for the same tag.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # Main only: derive the next semantic version from the conventional commits and tag it.
  version:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.info.outputs.version }}
      code: ${{ steps.info.outputs.code }}
      changed: ${{ steps.info.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, needed to find the commits since the last tag

      - name: Increment version if needed
        id: increment-version
        uses: RichardInnocent/semantic-versioning-git@v0.0.1

      - name: Work out version
        id: info
        env:
          PREVIOUS: ${{ steps.increment-version.outputs.previous-version }}
          NEW: ${{ steps.increment-version.outputs.new-version }}
        run: |
          VERSION="${NEW#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Could not read a version from '$NEW'. Tag the baseline first: git tag v0.9.5 && git push origin v0.9.5"
            exit 1
          fi
          # X*1000: the 999 slots below each release belong to development bundles.
          CODE=$(( (${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]}) * 1000 ))
          {
            echo "version=$VERSION"
            echo "code=$CODE"
            [ "$PREVIOUS" != "$NEW" ] && echo "changed=true" || echo "changed=false"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (versionCode $CODE), changed: $([ "$PREVIOUS" != "$NEW" ] && echo yes || echo no)"

  # Everything except main and development: debug APK for developers/testers. Not a Play build.
  build-test-apk:
    needs: test
    if: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          ABI_ONLY: ${{ inputs.abi_only }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          SLUG=$(echo "$REF_NAME" | tr -c 'A-Za-z0-9\n' '-' | cut -c1-40)
          ARGS="-PappVersionName=test-$SLUG-${GITHUB_RUN_NUMBER} -PappVersionCode=${GITHUB_RUN_NUMBER} -PappIdSuffix=.test"
          if [ -n "$ABI_ONLY" ]; then ARGS="$ARGS -PabiOnly=$ABI_ONLY"; fi
          chmod +x ./gradlew
          ./gradlew assembleDebug $ARGS --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: grimreader-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Development: signed AAB to upload by hand as a Play Console closed test.
  build-closed-test:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development # restricted to the development branch; holds its own copy of the upload key secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, to number the build after the last release

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true # never write build caches from a job that holds the signing key

      - name: Work out version
        id: info
        run: |
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [[ ! "$LAST" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::No release tag (vX.Y.Z) found; fetch tags or tag the baseline."; exit 1
          fi
          BASE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          # Commits on top of the last release. Starts at 1, so it can never equal a release code (always a multiple of 1000).
          N=$(git rev-list --count "$LAST..HEAD")
          [ "$N" -lt 1 ] && N=1
          if [ "$N" -gt 999 ]; then echo "::error::$N commits since $LAST, out of versionCode slots; cut a release."; exit 1; fi
          echo "version=${LAST#v}-dev.$N" >> "$GITHUB_OUTPUT"
          echo "code=$(( BASE * 1000 + N ))" >> "$GITHUB_OUTPUT"
          echo "Closed test ${LAST#v}-dev.$N (versionCode $(( BASE * 1000 + N )))"

      - uses: ./.github/actions/restore-upload-key
        with:
          keystore-base64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          key-alias: ${{ secrets.UPLOAD_KEY_ALIAS }}
          key-password: ${{ secrets.UPLOAD_KEY_PASSWORD }}

      - name: Build signed bundle
        env:
          VERSION: ${{ steps.info.outputs.version }}
          CODE: ${{ steps.info.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease -PappVersionName="$VERSION" -PappVersionCode="$CODE" --stacktrace
          mkdir out
          cp app/build/outputs/bundle/release/app-release.aab "out/Grimreader-$VERSION.aab"

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$HOME/.config/grimreader/signing.properties"

      - uses: actions/upload-artifact@v4
        with:
          name: grimreader-closed-test-aab
          path: out/*.aab
          if-no-files-found: error

  # Main when the commits produced a new version: signed APK + AAB attached to a GitHub release.
  release:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - uses: ./.github/actions/restore-upload-key
        with:
          keystore-base64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          key-alias: ${{ secrets.UPLOAD_KEY_ALIAS }}
          key-password: ${{ secrets.UPLOAD_KEY_PASSWORD }}

      - name: Build signed APK and bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -PappVersionName="$VERSION" -PappVersionCode="$CODE" --stacktrace
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk "release/Grimreader-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/Grimreader-$VERSION.aab"

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$HOME/.config/grimreader/signing.properties"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* --title "Grimreader $VERSION" --generate-notes --verify-tag
